<html>
  <head>
    <meta charset="utf-8" />
    <title>SheetJS Table Export</title>
  </head>
  <body>
    <table>
      <tbody>
        <tr>
          <td data-t="s" data-v="作业内容" id="sjs-A1">作业内容</td>
          <td id="sjs-B1"></td>
          <td data-t="s" data-v="作业段组" id="sjs-C1">作业段组</td>
          <td colspan="2" id="sjs-D1"></td>
          <td data-t="s" data-v="作业日期" id="sjs-F1">作业日期</td>
          <td id="sjs-G1"></td>
        </tr>
        <tr>
          <td data-t="s" data-v="作业地点" id="sjs-A2">作业地点</td>
          <td colspan="3" id="sjs-B2"></td>
          <td colspan="2" data-t="s" data-v="作业人员" id="sjs-E2">作业人员</td>
          <td id="sjs-G2"></td>
        </tr>
        <tr>
          <td rowspan="4" data-t="s" data-v="作业前" id="sjs-A3">作业前</td>
          <td data-t="s" data-v="安全交底" id="sjs-B3">安全交底</td>
          <td colspan="2" id="sjs-C3"></td>
          <td colspan="2" data-t="s" data-v="检测设备情况" id="sjs-E3">
            检测设备情况
          </td>
          <td id="sjs-G3"></td>
        </tr>
        <tr>
          <td data-t="s" data-v="通风排气情况" id="sjs-B4">通风排气情况</td>
          <td colspan="2" id="sjs-C4"></td>
          <td colspan="2" data-t="s" data-v="气体检测情况" id="sjs-E4">
            气体检测情况
          </td>
          <td id="sjs-G4"></td>
        </tr>
        <tr>
          <td data-t="s" data-v="安全防护设备" id="sjs-B5">安全防护设备</td>
          <td colspan="2" id="sjs-C5"></td>
          <td colspan="2" data-t="s" data-v="个人防护用品" id="sjs-E5">
            个人防护用品
          </td>
          <td id="sjs-G5"></td>
        </tr>
        <tr>
          <td data-t="s" data-v="其他补充措施" id="sjs-B6">其他补充措施</td>
          <td colspan="5" id="sjs-C6"></td>
        </tr>
        <tr>
          <td rowspan="10" data-t="s" data-v="作业中" id="sjs-A7">作业中</td>
          <td data-t="s" data-v="开始时间" id="sjs-B7">开始时间</td>
          <td colspan="2" id="sjs-C7"></td>
          <td colspan="2" data-t="s" data-v="是否中断" id="sjs-E7">是否中断</td>
          <td id="sjs-G7"></td>
        </tr>
        <tr>
          <td data-t="s" data-v="中断时长" id="sjs-B8">中断时长</td>
          <td colspan="2" id="sjs-C8"></td>
          <td colspan="2" data-t="s" data-v="再次检测情况" id="sjs-E8">
            再次检测情况
          </td>
          <td id="sjs-G8"></td>
        </tr>
        <tr>
          <td colspan="6" data-t="s" data-v="现场气体检测情况" id="sjs-B9">
            现场气体检测情况
          </td>
        </tr>
        <tr>
          <td
            data-t="s"
            data-v="     检测位置
  气体情况"
            id="sjs-B10"
            xml:space="preserve"
          >
            检测位置<br />气体情况
          </td>
          <td id="sjs-C10"></td>
          <td id="sjs-D10"></td>
          <td id="sjs-E10"></td>
          <td id="sjs-F10"></td>
          <td id="sjs-G10"></td>
        </tr>
        <tr>
          <td data-t="s" data-v="CO（ppm）" id="sjs-B11">CO（ppm）</td>
          <td id="sjs-C11"></td>
          <td id="sjs-D11"></td>
          <td id="sjs-E11"></td>
          <td id="sjs-F11"></td>
          <td id="sjs-G11"></td>
        </tr>
        <tr>
          <td data-t="s" data-v="H2S(ppm)" id="sjs-B12">H2S(ppm)</td>
          <td id="sjs-C12"></td>
          <td id="sjs-D12"></td>
          <td id="sjs-E12"></td>
          <td id="sjs-F12"></td>
          <td id="sjs-G12"></td>
        </tr>
        <tr>
          <td data-t="s" data-v="O2（%）" id="sjs-B13">O2（%）</td>
          <td id="sjs-C13"></td>
          <td id="sjs-D13"></td>
          <td id="sjs-E13"></td>
          <td id="sjs-F13"></td>
          <td id="sjs-G13"></td>
        </tr>
        <tr>
          <td data-t="s" data-v="可燃气体（%）" id="sjs-B14">可燃气体（%）</td>
          <td id="sjs-C14"></td>
          <td id="sjs-D14"></td>
          <td id="sjs-E14"></td>
          <td id="sjs-F14"></td>
          <td id="sjs-G14"></td>
        </tr>
        <tr>
          <td data-t="s" data-v="检测结果" id="sjs-B15">检测结果</td>
          <td id="sjs-C15"></td>
          <td id="sjs-D15"></td>
          <td id="sjs-E15"></td>
          <td id="sjs-F15"></td>
          <td id="sjs-G15"></td>
        </tr>
        <tr>
          <td data-t="s" data-v="检测员" id="sjs-B16">检测员</td>
          <td colspan="2" id="sjs-C16"></td>
          <td data-t="s" data-v="记录员" id="sjs-E16">记录员</td>
          <td colspan="2" id="sjs-F16"></td>
        </tr>
        <tr>
          <td data-t="s" data-v="作业结束" id="sjs-A17">作业结束</td>
          <td data-t="s" data-v="结束时间" id="sjs-B17">结束时间</td>
          <td colspan="2" id="sjs-C17"></td>
          <td colspan="2" data-t="s" data-v="清理检查情况" id="sjs-E17">
            清理检查情况
          </td>
          <td id="sjs-G17"></td>
        </tr>
        <tr>
          <td data-t="s" data-v="安全员" id="sjs-A18">安全员</td>
          <td colspan="2" id="sjs-B18"></td>
          <td colspan="2" data-t="s" data-v="现场负责人" id="sjs-D18">
            现场负责人
          </td>
          <td colspan="2" id="sjs-F18"></td>
        </tr>
        <tr>
          <td
            rowspan="2"
            colspan="7"
            data-t="s"
            data-v="备注：1、气体安全范围（氧气（O2）：19.5%~23% 可燃气体物质0% 一氧化碳（CO)＜24ppm 硫化氢(H2S)小于10ppm 
       2、该审批表作为进入有限空间作业的依据，不得涂改 要求各部门存档时间至少一年"
            id="sjs-A19"
          >
            备注：1、气体安全范围（氧气（O2）：19.5%~23% 可燃气体物质0%
            一氧化碳（CO)＜24ppm 硫化氢(H2S)小于10ppm <br />
            2、该审批表作为进入有限空间作业的依据，不得涂改
            要求各部门存档时间至少一年
          </td>
        </tr>
        <tr></tr>
      </tbody>
    </table>
  </body>
</html>
